name: Deploy Laravel Application to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Deploy to Hostinger via Git Pull
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: "82.25.96.67"
          port: "65002"
          username: "u995357878"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/u995357878/domains/brillianandco.group/public_html

            # Pull latest code from GitHub
            git pull origin main

            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Install and build frontend assets
            npm install
            npm run build

            # Create symbolic link for assets if it doesn't exist
            if [ ! -L "assets" ]; then
              ln -s /home/u995357878/domains/brillianandco.group/public_html/public/assets /home/u995357878/domains/brillianandco.group/public_html/assets
            fi

            # Ensure proper storage symlink structure
            if [ -L "public/storage" ]; then
              rm public/storage
            fi
            ln -s ../storage/app/public public/storage

            if [ -L "storage" ] && [ ! -d "storage" ]; then
              rm storage
            fi
            if [ ! -L "storage" ]; then
              ln -s public/storage storage
            fi

            # Run database migrations
            php artisan migrate --force

            # Clear all Laravel caches
            php artisan optimize:clear
            php artisan view:clear
            php artisan config:clear
            php artisan route:clear

            # Backpack Basset commands
            php artisan basset:clear
            php artisan basset:cache

            # Optimize Laravel for production
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
