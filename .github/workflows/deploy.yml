name: Deploy Laravel Application to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, mbstring, pdo
          
      - name: Copy Environment File
        run: cp .env.example .env
        
      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev --no-progress --no-interaction --prefer-dist
        
      - name: Generate Application Key
        run: php artisan key:generate
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          
      - name: Install NPM Dependencies
        run: npm ci
        
      - name: Build NPM Assets
        run: npm run build
        
      - name: Create rsync exclude file
        run: |
          cat > rsync-exclude.txt << EOF
          node_modules/
          .git/
          .github/
          .env.example
          tests/
          *.md
          .gitignore
          storage/
          .env
          *.tar.gz
          EOF
          
      - name: Deploy to Hostinger via rsync
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known_hosts
          ssh-keyscan -p 65002 -H 82.25.96.67 >> ~/.ssh/known_hosts
          
          # Deploy with rsync
          rsync -rlgoDzvc -i --delete \
            --exclude-from=rsync-exclude.txt \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ u995357878@82.25.96.67:/home/u995357878/domains/brillianandco.group/public_html/
            
      - name: Execute Laravel Post-Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "82.25.96.67"
          port: "65002"
          username: "u995357878"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            cd /home/u995357878/domains/brillianandco.group/public_html
            
            # Check if we're in a Laravel directory
            if [ ! -f "artisan" ]; then
              echo "Error: artisan file not found. Not in Laravel directory."
              exit 1
            fi
            
            # Set proper permissions again
            chmod -R 755 storage bootstrap/cache
            
            # Clear all caches before running commands
            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan cache:clear || true
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear and cache Backpack Basset assets
            php artisan basset:clear || true
            php artisan basset:cache || true
            
            # Optimize Laravel for production
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            
            # Final permission check
            chmod -R 755 storage bootstrap/cache
            
            echo "Deployment completed successfully!"
            
      - name: Health Check
        run: |
          sleep 10
          curl -f https://brillianandco.group || echo "Health check failed - site may still be starting up"
